# Docker Compose for Production
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Includes:
# - PostgreSQL database (persistent volume)
# - Quant Sticky Note service
# - Supervisor for process management
# - Nginx reverse proxy (optional)

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quant_stickynote_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quant_stickynote
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./db_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant_stickynote_prod

  app:
    image: quant_stickynote:latest
    container_name: quant_stickynote_app_prod
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/quant_stickynote
      SERVICE_NAME: quant_stickynote
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      TRIGGER_TIME: ${TRIGGER_TIME:-09:30}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_WORKERS: ${API_WORKERS:-8}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      EXTERNAL_DB_HOST: ${EXTERNAL_DB_HOST}
      EXTERNAL_DB_PORT: ${EXTERNAL_DB_PORT}
      EXTERNAL_DB_USER: ${EXTERNAL_DB_USER}
      EXTERNAL_DB_PASSWORD: ${EXTERNAL_DB_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - quant_stickynote_prod
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: quant_stickynote_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - quant_stickynote_prod
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

volumes:
  postgres_prod_data:
    driver: local

networks:
  quant_stickynote_prod:
    name: quant_stickynote_prod
