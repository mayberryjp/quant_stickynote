[pytest]
# Pytest Configuration for Quant Sticky Note
# Documentation: https://docs.pytest.org/en/stable/reference.html#ini-options

# Test discovery patterns
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 7.0

# Add current directory to Python path
pythonpath = src

# Output options
# -v = Verbose output
# --tb=short = Shorter traceback format
# --strict-markers = Error on unknown markers
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src/quant_stickynote
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-branch

# Markers for organizing tests
markers =
    unit: Unit tests (fast, mocked dependencies)
    integration: Integration tests (slow, real database)
    slow: Tests that take a long time to run
    requires_db: Tests that require a database
    requires_external_db: Tests that require external database connection

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test coverage options
[coverage:run]
source = src/quant_stickynote
branch = True
omit =
    */tests/*
    */test_*.py
    */__main__.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
