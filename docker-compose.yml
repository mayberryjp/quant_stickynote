version: "3.8"

services:
  app:
    build: .
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      TRIGGER_TIME: "${TRIGGER_TIME:-09:30}"
      CHECK_INTERVAL_SECONDS: "${CHECK_INTERVAL_SECONDS:-60}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    expose:
      - "8000"
    ports:
      - "8000:8000"
